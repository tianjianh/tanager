  COUNTINHIBIT_EN: [true, false, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true]
  MCOUNTENABLE_EN: [true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true]
  NUM_PMP_ENTRIES: 16
  PMP_GRANULARITY: 2
  NUM_USABLE_PMP_ENTRIES: 16
  PMP_NA4_SUPPORTED: true
  PMP_NAPOT_SUPPORTED: true
  PMP_TOR_SUPPORTED: true
