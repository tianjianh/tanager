$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: core-m3-rv64imafdc-hpm
description: "Tanager tg_core at M3 with F/D; RV64IMAFDC with Zba, Zbb, Zbs, Zicond, S and U, Sv39, Sstc, 16 PMP entries, M9's performance counters (TG_HPM: mhpmcounter3-6 with Sscofpmf)"
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  - { name: A, version: "= 2.1.0" }
  - { name: Zaamo, version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }
  - { name: F, version: "= 2.2.0" }
  - { name: D, version: "= 2.2.0" }
