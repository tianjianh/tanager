# Stage D (docs/spec/soc.md §8.2): drivers Debian's kernel lacks for the PS peripherals the RISC-V drives
# through the PS window, built by DKMS from the running kernel's own sources (Debian's linux-source-6.12):
# the Arasan SD controller (D4, the root on the card) and the Cadence UART (UART1's login under Debian).
# A kernel update rebuilds them (AUTOINSTALL).
PACKAGE_NAME="tanager-ps"
PACKAGE_VERSION="1.0"
PRE_BUILD="prepare.sh"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILT_MODULE_NAME[0]="sdhci-of-arasan"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="xilinx_uartps"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
