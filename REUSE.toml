version = 1
# Licensing by path (REUSE specification 3.x; the last matching annotation wins).
# Decided by the project's author on 2026-10-14 (D7, DR-018): Solderpad Hardware License 2.1 for the
# hardware, Apache-2.0 for the software. See LICENSE.

# Software, scripts, models, tests in C/C++/Python/assembly, and documentation.
[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tianjian Huang"
SPDX-License-Identifier = "Apache-2.0"

# Hardware: the RTL, FPGA design and build files, constraints, device-tree overlays for the PL, and HDL
# test benches.
[[annotations]]
path = [
  "rtl/**",
  "fpga/**/*.sv", "fpga/**/*.svh", "fpga/**/*.v", "fpga/**/*.vh",
  "fpga/**/*.xdc", "fpga/**/*.tcl", "fpga/**/*.f", "fpga/**/*.tsv", "fpga/**/*.dtso",
  "sim/**/*.sv", "sim/**/*.svh",
  "tests/**/*.sv", "tests/**/*.svh", "tests/**/*.v",
  "**/*.vlt",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tianjian Huang"
SPDX-License-Identifier = "SHL-2.1"

# Reports generated by AMD Vivado during this project's runs, kept for engineering reference. Their headers
# carry AMD's copyright notice; the project does not license them.
[[annotations]]
path = ["fpga/**/results/**"]
precedence = "override"
SPDX-FileCopyrightText = "Generated by AMD Vivado; see each file's header"
SPDX-License-Identifier = "LicenseRef-Vivado-Generated-Report"
